name: RPA Orchestrator CI

# 1. EVENTOS (TRIGGERS)
# ¿Cuándo se activa este robot?
on:
  push:
    branches: ["main"] # Al hacer push a main
  pull_request:
    branches: ["main"] # Al abrir un PR hacia main

jobs:
  test-app:
    runs-on: ubuntu-latest # Usamos una máquina virtual Linux de GitHub

    # 2. SERVICIOS (La infraestructura temporal)
    # GitHub levanta estos contenedores solo para el test y luego los destruye
    services:
      # Necesitamos Postgres porque tu App intenta conectarse al iniciar
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rpa_db
        ports:
          - 5432:5432
        # Healthcheck: Esperamos a que la BD esté lista antes de seguir
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Necesitamos Redis porque Celery intenta conectarse al iniciar
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    # 3. PASOS (STEPS)
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Tests (Pytest)
        env:
          # Apuntamos a los servicios que definimos arriba (localhost en GitHub Actions)
          DATABASE_URL: postgresql://user:password@localhost:5432/rpa_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Importante: Añadimos el directorio actual al PYTHONPATH para que encuentre 'app'
          PYTHONPATH: .
        run: |
          pytest
