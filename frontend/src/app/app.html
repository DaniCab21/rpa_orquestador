<div class="container">
  <h1>🤖 RPA Orchestrator</h1>

  <div *ngIf="!token" class="login-box">
    <h2>Iniciar Sesión</h2>
    <div class="form-group">
      <input type="text" [(ngModel)]="email" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" [(ngModel)]="password" placeholder="Contraseña">
    </div>
    <button (click)="onLogin()">Entrar</button>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </div>

  <div *ngIf="token" class="dashboard">
    <div class="header">
        <h3 class="success">Panel de Control</h3>
        <button (click)="logout()" class="logout-btn">Salir</button>
    </div>

    <div class="control-panel">
        <label>URL Objetivo para los Bots:</label>
        <input type="text" [(ngModel)]="targetUrl" placeholder="https://...">
    </div>

    <div *ngIf="executionMessage" class="alert">
        {{ executionMessage }}
    </div>

    <div class="bot-list">
        <div *ngFor="let bot of bots" class="bot-card">
            <div class="bot-info">
                <h4>🤖 {{ bot.name }}</h4>
                <p>{{ bot.description }}</p>
                <small>Estado: <strong>{{ bot.status }}</strong></small>
            </div>
            <div class="bot-actions">
                <button (click)="runBot(bot.name)">▶ Ejecutar</button>
            </div>
        </div>
    </div>
    
    <p *ngIf="bots.length === 0">No hay bots registrados en la base de datos.</p>
  </div>
</div>
